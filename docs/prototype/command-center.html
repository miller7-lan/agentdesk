<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentDesk 指挥中心</title>
<style>
/* AgentDesk command centre prototype: white liquid glass.
   Glass only on the floating layer (top bar, quota strip, dispatch bar, drawer); content sits on solid cards.
   Radii are concentric: an inner radius is its parent's radius minus the padding between them. */
:root {
  --ink: #13223a; --muted: #55657a; --faint: #8a97a8; --line: rgba(19, 34, 58, .09);
  --teal: #2fb59c; --blue: #5b7be8; --amber: #d08a1c; --red: #d4485e; --grey: #9aa6b6;
  --brand: linear-gradient(120deg, #2fb59c, #5b7be8);
  --r-outer: 22px; --pad: 10px; --r-inner: calc(var(--r-outer) - var(--pad));
  --font: -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI Variable Text", "Microsoft YaHei UI", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 13px/1.5 var(--font); color: var(--ink); overflow: hidden;
  background: #eef2f7; }
/* the scene behind the glass: slow soft light so the glass has something to bend */
.scene { position: fixed; inset: 0; z-index: 0; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 0%, #fbfcfe 0%, #f1f5fa 55%, #e8edf5 100%); }
.scene i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; animation: drift 26s ease-in-out infinite alternate; }
.scene i:nth-child(1) { width: 46vw; height: 46vw; left: -8vw; top: -12vw; background: #9fe8d8; }
.scene i:nth-child(2) { width: 40vw; height: 40vw; right: -6vw; top: 6vh; background: #b9c6ff; animation-delay: -8s; }
.scene i:nth-child(3) { width: 34vw; height: 34vw; left: 30vw; bottom: -16vw; background: #ffd9c4; opacity: .35; animation-delay: -15s; }
@keyframes drift { to { transform: translate(4vw, 3vh) scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .scene i { animation: none; } }

/* Liquid glass: refraction (SVG displacement of what is behind), blur, saturation, a top-left specular rim. */
.glass { position: relative; background: rgba(255, 255, 255, .42);
  -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: url(#lens) blur(18px) saturate(180%);
  border-radius: var(--r-outer);
  box-shadow: inset 1.5px 1.5px 0 rgba(255, 255, 255, .95), inset -1px -1px 0 rgba(255, 255, 255, .45),
    inset 0 0 22px rgba(255, 255, 255, .45), 0 1px 2px rgba(20, 40, 70, .06), 0 12px 32px rgba(20, 40, 70, .10); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(120% 70% at 12% 0%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 55%); }
.glass > * { position: relative; }

.app { position: relative; z-index: 1; display: grid; grid-template-columns: 64px 1fr; height: 100vh; gap: 12px; padding: 12px; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; }
.rail .logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: #172126; margin-bottom: 8px; }
.rail button { width: 44px; height: 44px; border: 0; border-radius: 14px; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; font-size: 10px; gap: 1px; }
.rail button svg { width: 19px; height: 19px; }
.rail button[aria-pressed="true"] { background: rgba(255, 255, 255, .75); color: var(--ink); box-shadow: 0 2px 8px rgba(20, 40, 70, .10); }
.rail .spacer { flex: 1; }
svg.i { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.main { display: grid; grid-template-rows: auto auto auto 1fr; gap: 12px; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; border-radius: 18px; }
.top h1 { margin: 0 8px 0 0; font-size: 15px; font-weight: 700; }
.chips { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: rgba(255, 255, 255, .45); }
.chips button { height: 26px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; cursor: pointer; }
.chips button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(20, 40, 70, .12); }
.top .grow { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 14px; background: rgba(255, 255, 255, .6); color: var(--muted); font-size: 12px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
.dot.amber { background: var(--amber); } .dot.red { background: var(--red); } .dot.grey { background: var(--grey); }

/* quota strip */
.quotas { display: grid; grid-template-columns: repeat(4, minmax(210px, 1fr)) minmax(190px, .8fr); gap: 12px; }
.qcard { padding: var(--pad); display: grid; grid-template-rows: auto 1fr auto; gap: 6px; }
.qhead { display: flex; align-items: center; gap: 8px; padding: 2px 4px 0; }
.qhead img { width: 22px; height: 22px; }
.qhead b { font-size: 13.5px; }
.level { margin-left: auto; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 600; }
.level.ok { background: rgba(47, 181, 156, .14); color: #1d8a75; }
.level.reserved { background: rgba(208, 138, 28, .14); color: #a86c10; }
.level.stopped { background: rgba(212, 72, 94, .13); color: #b4344a; }
.level.auth { background: rgba(154, 166, 182, .2); color: #5d6b7d; }
.qbody { display: grid; grid-template-columns: 82px 1fr; gap: 10px; align-items: center; padding: 8px; border-radius: var(--r-inner); background: rgba(255, 255, 255, .62); }
.ring { position: relative; width: 82px; height: 82px; }
.ring svg { width: 82px; height: 82px; transform: rotate(-90deg); }
.ring .big { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
.ring .big b { font-size: 18px; font-variant-numeric: tabular-nums; }
.ring .big small { display: block; color: var(--faint); font-size: 10px; }
.qstats { display: grid; gap: 3px; font-size: 12px; min-width: 0; }
.qstats .row { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.qstats .row b { margin-left: auto; font-variant-numeric: tabular-nums; }
.qstats .reset { margin: -3px 0 2px 13px; color: var(--faint); font-size: 11px; white-space: nowrap; }
.qstats .key { width: 7px; height: 7px; border-radius: 2px; align-self: center; }
.qfoot { display: grid; gap: 4px; padding: 0 4px 2px; font-size: 11px; color: var(--muted); }
.thresholds { position: relative; height: 5px; border-radius: 3px; background: rgba(19, 34, 58, .08); overflow: visible; }
.thresholds .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.thresholds .mark { position: absolute; top: -3px; width: 2px; height: 11px; border-radius: 1px; background: var(--ink); opacity: .35; }
.qfoot .now { display: flex; align-items: center; gap: 6px; }
.qfoot .now .live { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.res { padding: var(--pad) 14px; display: grid; gap: 7px; align-content: start; font-size: 12px; }
.res h3 { margin: 2px 0 2px; font-size: 13px; }
.bar { height: 6px; border-radius: 3px; background: rgba(19, 34, 58, .08); overflow: hidden; } .bar i { display: block; height: 100%; border-radius: 3px; background: var(--brand); }
.res .row { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; color: var(--muted); }
.res .row b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* dispatch bar */
.dispatch { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-radius: 18px; }
.dispatch input { flex: 1; min-width: 0; height: 36px; border: 0; background: transparent; font: inherit; font-size: 14px; color: var(--ink); outline: none; }
.dispatch select { height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255, 255, 255, .7); font: inherit; color: var(--ink); }
.send { width: 36px; height: 36px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 12px rgba(91, 123, 232, .35); }
.attention { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 0; border-radius: 10px; background: rgba(208, 138, 28, .14); color: #8a5a0c; font: inherit; font-weight: 600; cursor: pointer; }

/* board: columns are faint glass, cards are solid for reading */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; min-height: 0; }
.col { display: flex; flex-direction: column; min-height: 0; padding: 8px; border-radius: var(--r-outer); background: rgba(255, 255, 255, .28); border: 1px solid rgba(255, 255, 255, .6); }
.col h2 { display: flex; align-items: center; gap: 8px; margin: 4px 6px 8px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.col h2 .n { padding: 0 7px; border-radius: 8px; background: rgba(255, 255, 255, .8); color: var(--ink); font-size: 11px; }
.col .list { display: grid; gap: 8px; overflow: auto; align-content: start; padding: 2px; }
.card { display: grid; gap: 7px; padding: 11px 12px; border: 0; border-radius: var(--r-inner); background: #fff; text-align: left; font: inherit; color: inherit; cursor: pointer;
  box-shadow: 0 1px 2px rgba(20, 40, 70, .06), 0 4px 14px rgba(20, 40, 70, .06); transition: transform .15s, box-shadow .15s; }
.card:hover, .card:focus-visible { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(20, 40, 70, .08), 0 10px 24px rgba(20, 40, 70, .10); outline: none; }
.card[aria-current="true"] { box-shadow: 0 0 0 2px rgba(91, 123, 232, .55), 0 10px 24px rgba(20, 40, 70, .10); }
.card .meta { display: flex; align-items: center; gap: 6px; color: var(--faint); font-size: 11px; }
.card .meta .proj { padding: 0 6px; border-radius: 6px; background: #f1f4f8; color: var(--muted); }
.card .meta .t { margin-left: auto; }
.card .title { font-size: 13px; font-weight: 600; line-height: 1.4; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; }
.step { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px 0 3px; border-radius: 11px; background: #f3f6f9; font-size: 11px; color: var(--muted); }
.step img { width: 16px; height: 16px; }
.step.running { background: rgba(47, 181, 156, .12); color: #1d8a75; }
.step.done { color: var(--ink); } .step.done::after { content: "✓"; color: var(--teal); }
.step.failed { background: rgba(212, 72, 94, .1); color: #b4344a; }
.progress { height: 4px; border-radius: 2px; background: #eef1f5; overflow: hidden; } .progress i { display: block; height: 100%; background: var(--brand); }
.card .note { color: var(--muted); font-size: 12px; }
.card .act { justify-self: start; padding: 3px 10px; border-radius: 8px; background: rgba(208, 138, 28, .13); color: #8a5a0c; font-size: 11.5px; font-weight: 600; }

/* drawer */
.drawer { position: fixed; z-index: 5; top: 12px; right: 12px; bottom: 12px; width: min(560px, 46vw); display: grid; grid-template-rows: auto auto 1fr auto;
  padding: var(--pad); transform: translateX(calc(100% + 24px)); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.drawer.open { transform: none; }
.dhead { display: flex; align-items: flex-start; gap: 10px; padding: 8px 8px 10px; }
.dhead h3 { margin: 0; font-size: 15px; line-height: 1.4; }
.dhead small { color: var(--faint); }
.close { margin-left: auto; width: 30px; height: 30px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, .6); cursor: pointer; font-size: 16px; color: var(--muted); }
.tabs { display: flex; gap: 4px; padding: 3px; margin: 0 4px 8px; border-radius: 12px; background: rgba(255, 255, 255, .45); overflow-x: auto; }
.tabs button { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; cursor: pointer; white-space: nowrap; }
.tabs button img { width: 16px; height: 16px; }
.tabs button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(20, 40, 70, .12); }
.dbody { overflow: auto; padding: 4px; border-radius: var(--r-inner); background: rgba(255, 255, 255, .78); }
.dbody .sec { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.dbody .sec:last-child { border: 0; }
.who { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-weight: 600; }
.who img { width: 22px; height: 22px; } .who span { color: var(--faint); font-weight: 400; font-size: 12px; }
.plan { margin: 0; padding-left: 18px; } .plan li { margin: 3px 0; }
.brd { display: grid; gap: 2px; }
.brd .r { display: grid; grid-template-columns: 22px 92px 96px 64px 1fr; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 8px; font-size: 12px; }
.brd .r:hover { background: #f4f7fa; }
.brd img { width: 20px; height: 20px; }
.brd .st { padding: 0 7px; border-radius: 8px; background: #eef1f5; font-size: 11px; justify-self: start; }
.brd .st.running { background: rgba(47, 181, 156, .14); color: #1d8a75; }
.brd .note { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.summary { padding: 8px 10px; border-radius: 10px; background: #f5f8fb; }
.actv { display: grid; gap: 6px; }
.a { border-radius: 10px; font-size: 12.5px; }
.a .tag { display: inline-block; padding: 0 6px; border-radius: 6px; background: #eef1f5; color: var(--faint); font-size: 10.5px; font-weight: 600; margin-right: 6px; }
.a.think { padding: 7px 10px; background: rgba(47, 181, 156, .08); color: var(--muted); font-style: italic; }
.a.think .tag { background: rgba(47, 181, 156, .16); color: #1d8a75; font-style: normal; }
.a.cmd { border: 1px solid var(--line); } .a.cmd .h { padding: 6px 10px; } .a.cmd code { font-family: var(--mono); font-size: 12px; }
.a.cmd pre { margin: 0; padding: 8px 10px; border-top: 1px solid var(--line); background: #f6f8fa; font: 11.5px/1.5 var(--mono); white-space: pre-wrap; border-radius: 0 0 10px 10px; }
.a.edit, .a.msg { padding: 4px 2px; } .a.edit code { font-family: var(--mono); font-size: 12px; }
.diff { margin: 0; padding: 10px 12px; border-radius: 10px; background: #f6f8fa; font: 11.5px/1.6 var(--mono); white-space: pre; overflow: auto; }
.diff .add { color: #1a7f4e; background: #e9f7ef; display: block; } .diff .del { color: #b4344a; background: #fcecef; display: block; }
.dfoot { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 4px 2px; }
.btn { height: 34px; padding: 0 14px; border: 0; border-radius: 11px; background: rgba(255, 255, 255, .8); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 1px 3px rgba(20, 40, 70, .1); }
.btn.primary { background: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(91, 123, 232, .3); }
.scrim { position: fixed; inset: 0; z-index: 4; background: rgba(240, 244, 250, .25); opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.legend { position: fixed; z-index: 2; left: 88px; bottom: 6px; color: var(--faint); font-size: 11px; }
@media (max-width: 1200px) { .quotas { grid-template-columns: repeat(2, 1fr); } .res { display: none; } .board { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- lensing: a soft noise field bends what is behind the glass a little, like thick glass -->
  <filter id="lens" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="38" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="scene" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="app">
  <nav class="rail glass" aria-label="主导航">
    <div class="logo"><svg viewBox="0 0 256 256" width="26" height="26"><rect x="68" y="68" width="120" height="120" rx="26" transform="rotate(45 128 128)" fill="none" stroke="#5fe0c6" stroke-width="18"/><path d="M104 106 L130 128 L104 150" fill="none" stroke="#e9f7f3" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <button aria-pressed="true" title="指挥中心"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg></button>
    <button aria-pressed="false" title="我的单聊"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
    <button aria-pressed="false" title="工作区"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/></svg></button>
    <div class="spacer"></div>
    <button aria-pressed="false" title="诊断"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></button>
    <button aria-pressed="false" title="外观"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16" opacity=".4"/></svg></button>
  </nav>

  <main class="main">
    <header class="top glass">
      <h1>指挥中心</h1>
      <div class="chips" id="projects" role="group" aria-label="项目"></div>
      <div class="grow"></div>
      <span class="pill"><span class="dot"></span>VPS2 · SSH 主用</span>
      <span class="pill"><span class="dot grey"></span>Relay 备用</span>
    </header>

    <section class="quotas" id="quotas" aria-label="额度"></section>

    <form class="dispatch glass" id="dispatch">
      <button type="button" class="attention" id="attention"></button>
      <input id="ask" placeholder="向组长派活：描述要做的事，组长会先给方案…" aria-label="派活内容">
      <select id="askProject" aria-label="项目"></select>
      <select aria-label="执行者"><option>由组长分派</option><option>@Codex 直接改</option><option>@Grok Build 直接改</option><option>@Antigravity 查资料</option></select>
      <button class="send" aria-label="发送"><svg class="i" viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
    </form>

    <section class="board" id="board" aria-label="任务看板"></section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer glass" id="drawer" aria-label="任务详情" aria-hidden="true">
  <div class="dhead"><div><h3 id="dTitle"></h3><small id="dMeta"></small></div><button class="close" id="dClose" aria-label="关闭">×</button></div>
  <div class="tabs" id="dTabs" role="tablist"></div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot" id="dFoot"></div>
</aside>
<p class="legend">原型 · 模拟数据 · 点任务卡片打开详情；外环 5 小时窗口，内环每周窗口</p>

<script>

];
const tasks = [
  { id: 'a2b3', project: 'billing-service', col: 'plan', title: '账单页面支持导出 CSV', t: '2 分钟前', note: '组长给出 3 步方案，等你确认', act: '确认方案',

  { id: '9f1c', project: 'agentdesk', col: 'run', title: '登录接口偶尔超时，定位并修复，补一个测试', t: '12 分钟', progress: 55,

  { id: 'c4d5', project: 'agentdesk', col: 'run', title: '调研升级到 Node 24 LTS 的影响', t: '4 分钟', progress: 30,
    steps: [['antigravity', 'running', '查资料']] },
  { id: '77de', project: 'agentdesk', col: 'review', title: '群聊折叠旧任务，避免无限变长', t: '刚刚', note: '补丁 3 个文件 · 审查通过 · 验收通过', act: '审核补丁',
    steps: [['codex', 'done', '改代码'], ['grok', 'done', '审查'], ['lead', 'done', '验收']] },
  { id: '0f12', project: 'billing-service', col: 'done', title: '修复发票金额四舍五入', t: '1 小时前', steps: [['codex', 'done', '改代码'], ['grok', 'done', '审查']] },
  { id: '3e4a', project: 'agentdesk', col: 'done', title: '开机动画：logo 从图标后面探头', t: '3 小时前', steps: [['codex', 'done', '改代码']] },
];
const columns = [['plan', '待确认方案'], ['run', '执行中'], ['review', '待你处理'], ['done', '已完成']];
let project = '全部';
let open = null;
let tab = 'overview';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const color = (level) => ({ ok: '#2fb59c', reserved: '#d08a1c', stopped: '#d4485e', auth: '#9aa6b6' })[level];

function ring(q) {
  const c = color(q.level);
  const arc = (r, pct, w, alpha) => {
    const len = 2 * Math.PI * r;
    return `<circle cx="41" cy="41" r="${r}" fill="none" stroke="rgba(19,34,58,.08)" stroke-width="${w}"/>
      <circle cx="41" cy="41" r="${r}" fill="none" stroke="${c}" stroke-opacity="${alpha}" stroke-width="${w}" stroke-linecap="round"
        stroke-dasharray="${len * pct / 100} ${len}"/>`;
  };
  const top = Math.max(q.five, q.week);
  return `<div class="ring"><svg viewBox="0 0 82 82">${arc(35, q.five, 7, 1)}${arc(24, q.week, 6, .55)}</svg>
    <div class="big"><div><b>${top}%</b><small>${q.five >= q.week ? '5 小时' : '每周'}</small></div></div></div>`;
}

function renderQuotas() {
  $('#quotas').innerHTML = quotas.map((q) => `<article class="qcard glass" aria-label="${names[q.id]} 额度">
    <div class="qhead"><img src="${A(q.avatar || q.id)}" alt=""><b>${names[q.id]}</b><span class="level ${q.level}">${q.label}</span></div>
    <div class="qbody">${ring(q)}<div class="qstats">
      <div class="row"><i class="key" style="background:${color(q.level)}"></i>5 小时<b>${q.five}%</b></div><div class="reset">${q.fiveReset}重置</div>
      <div class="row"><i class="key" style="background:${color(q.level)};opacity:.55"></i>每周<b>${q.week}%</b></div><div class="reset">${q.weekReset}重置</div>
      <div class="row">今日任务<b>${q.today} 次</b></div>
    </div></div>
    <div class="qfoot">
      <div class="thresholds" title="软线 ${q.soft}% · 硬线 ${q.hard}%"><span class="fill" style="width:${Math.max(q.five, q.week)}%;background:${color(q.level)}"></span>
        <span class="mark" style="left:${q.soft}%"></span><span class="mark" style="left:${q.hard}%"></span></div>
      <div class="now">${q.live ? '<span class="live"></span>' : ''}${esc(q.now)}</div>
    </div></article>`).join('') + `<article class="res glass" aria-label="VPS2 资源"><h3>VPS2 · 4 GB</h3>
    ${[['内存', 72, '2.9 / 4 GB'], ['交换', 15, '0.3 / 2 GB'], ['容器', 50, '1 / 2'], ['磁盘', 38, '剩 62%']].map(([k, v, t]) =>
      `<div class="row">${k}<div class="bar"><i style="width:${v}%"></i></div><b>${t}</b></div>`).join('')}</article>`;
}

function renderBoard() {
  const shown = tasks.filter((t) => project === '全部' || t.project === project);
  $('#board').innerHTML = columns.map(([key, label]) => {
    const list = shown.filter((t) => t.col === key);
    return `<div class="col"><h2>${label}<span class="n">${list.length}</span></h2><div class="list">${list.map((t) => {
      const done = t.steps.filter((s) => s[1] === 'done').length;
      return `<button class="card" data-task="${t.id}" aria-current="${open === t.id}">
        <div class="meta"><span class="mono">#${t.id}</span><span class="proj">${esc(t.project)}</span><span class="t">${t.t}</span></div>
        <div class="title">${esc(t.title)}</div>
        <div class="steps">${t.steps.map(([who, st, what]) => `<span class="step ${st}"><img src="${A(who)}" alt="">${what}</span>`).join('')}</div>
        ${key === 'run' ? `<div class="progress"><i style="width:${t.progress || done / t.steps.length * 100}%"></i></div>` : ''}
        ${t.note ? `<div class="note">${esc(t.note)}</div>` : ''}
        ${t.act ? `<span class="act">${t.act}</span>` : ''}
      </button>`;
    }).join('')}</div></div>`;
  }).join('');
  const waiting = tasks.filter((t) => t.col === 'plan' || t.col === 'review').length;
  $('#attention').textContent = `待你处理 ${waiting}`;
}

function renderProjects() {
  const list = ['全部', ...new Set(tasks.map((t) => t.project))];
  $('#projects').innerHTML = list.map((p) => `<button type="button" aria-pressed="${p === project}" data-project="${esc(p)}">${esc(p)}</button>`).join('');
  $('#askProject').innerHTML = list.slice(1).map((p) => `<option>${esc(p)}</option>`).join('');
}

const activity = `<div class="actv">
  <div class="a think"><span class="tag">思考</span>侦察说明指出 refreshToken() 没有超时。先看 client.js 里 fetch 的封装，再决定在哪一层加超时，避免影响其他请求。</div>
  <div class="a cmd"><div class="h"><span class="tag">运行</span><code>rg -n "refreshToken" src</code></div><pre>src/auth/client.js:41:export async function refreshToken(session) {
src/auth/session.js:88:  await refreshToken(this)</pre></div>
  <div class="a edit"><span class="tag">改文件</span><code>src/auth/client.js</code> 修改 · <code>test/auth.test.js</code> 新建</div>
  <div class="a cmd"><div class="h"><span class="tag">运行</span><code>npm test</code> <span style="color:var(--faint)">运行中…</span></div></div>
</div>`;

function renderDrawer() {
  const t = tasks.find((x) => x.id === open);
  $('#drawer').classList.toggle('open', Boolean(t));
  $('#drawer').setAttribute('aria-hidden', String(!t));
  $('#scrim').classList.toggle('on', Boolean(t));
  if (!t) return;
  $('#dTitle').textContent = t.title;
  $('#dMeta').textContent = `#${t.id} · ${t.project} · ${columns.find((c) => c[0] === t.col)[1]}`;
  const members = [...new Set(t.steps.map((s) => s[0]))];
  const tabs = [['overview', '概览'], ...members.map((m) => [m, names[m]]), ...(t.col === 'review' ? [['patch', '补丁']] : [])];
  if (!tabs.some(([k]) => k === tab)) tab = 'overview';
  $('#dTabs').innerHTML = tabs.map(([k, l]) => `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${k !== 'overview' && k !== 'patch' ? `<img src="${A(k)}" alt="">` : ''}${l}</button>`).join('');
  let body;
  if (tab === 'overview') {
    body = `<div class="sec"><div class="who"><img src="${A('lead')}" alt="">组长<span>方案</span></div>
      <ol class="plan">${t.steps.map(([w, , what]) => `<li><b>${names[w]}</b> ${what}</li>`).join('')}</ol></div>
      <div class="sec"><div class="who">分工进度</div><div class="brd">${t.steps.map(([w, st, what]) => `<div class="r"><img src="${A(w)}" alt=""><b>${names[w]}</b><span>${what}</span>
        <span class="st ${st}">${{ done: '完成', running: '执行中', queued: '排队' }[st]}</span><span class="note">${st === 'done' ? '已完成，见成员记录' : ''}</span></div>`).join('')}</div></div>
      ${t.steps.some((s) => s[1] === 'done') ? `<div class="sec"><div class="who"><img src="${A(t.steps[0][0])}" alt="">${names[t.steps[0][0]]}<span>完成总结</span></div>
        <div class="summary">超时发生在 refreshToken() 调用外部认证服务时：没有设置超时，网络抖动时请求会一直挂起。建议加 10 秒超时并重试一次。</div></div>` : ''}`;
  } else if (tab === 'patch') {
    body = `<div class="sec"><pre class="diff">--- a/src/auth/client.js
+++ b/src/auth/client.js
@@ -38,6 +38,12 @@
<span class="del">-  const response = await fetch(url, options)</span><span class="add">+  const response = await withTimeout(fetch(url, options), 10_000)</span><span class="add">+    .catch(() => withTimeout(fetch(url, options), 10_000))</span></pre></div>`;
  } else {
    body = `<div class="sec"><div class="who"><img src="${A(tab)}" alt="">${names[tab]}<span>组长派遣 · 工作过程</span></div>
      <div class="summary" style="margin-bottom:10px"><b>任务</b>　按侦察结论给 refreshToken 加 10 秒超时和一次重试，并补单元测试。</div>${activity}</div>`;
  }
  $('#dBody').innerHTML = body;
  $('#dFoot').innerHTML = t.col === 'plan' ? '<button class="btn">要求调整</button><button class="btn primary">确认方案并开始</button>'
    : t.col === 'review' ? '<button class="btn">打回返工</button><button class="btn primary">应用到本机</button>'
    : t.col === 'run' ? '<button class="btn">停止</button>' : '<button class="btn">引用到新任务</button>';
}

function render() { renderProjects(); renderQuotas(); renderBoard(); renderDrawer(); }
document.addEventListener('click', (e) => {
  const card = e.target.closest('[data-task]'); if (card) { open = card.dataset.task; tab = 'overview'; render(); return; }
  const p = e.target.closest('[data-project]'); if (p) { project = p.dataset.project; render(); return; }
  const tb = e.target.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; renderDrawer(); return; }
  if (e.target.closest('#dClose') || e.target.id === 'scrim') { open = null; render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && open) { open = null; render(); } });
$('#dispatch').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('#ask').value.trim(); if (!text) return;
  tasks.unshift({ id: Math.random().toString(16).slice(2, 6), project: $('#askProject').value, col: 'plan', title: text, t: '刚刚', note: '组长正在规划…', steps: [['lead', 'running', '规划']] });
  $('#ask').value = ''; render();
});
render();
</script>
</body>
</html>
