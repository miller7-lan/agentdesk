<title>AgentDesk 群聊原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: desktop window frame — activity bar | project tree | group timeline | member/task panel, status bar below.
   Tokens follow AgentDesk src/styles.css (dark-first), plus member colours and bot ink. */
:root {
  --bg: #1b1d21; --side: #202328; --main: #16181b; --panel: #1d2024; --raised: #262a30; --hover: #2c3037;
  --border: #30343b; --text: #d6d9de; --muted: #8b919b; --faint: #5d636c;
  --accent: #3fb9a2; --accent-ink: #0f1f1c; --accent-soft: rgba(63,185,162,.14);
  --warn: #e0a84a; --warn-soft: rgba(224,168,74,.12); --danger: #e06c6c; --danger-soft: rgba(224,108,108,.13);
  --ok: #6cc489; --ok-soft: rgba(108,196,137,.13); --user-bubble: #23272d; --code-bg: #121417; --shadow: 0 8px 28px rgba(0,0,0,.4);
  --m-lead: #a58bf0; --m-cx: #19c37d; --m-cc: #e39a5c; --m-ag: #6aa4f0; --m-gk: #b9bfc9; --m-local: #e07bb0; --m-you: #3fb9a2;
  --bot-ink: #15171b; --bot-shadow: rgba(0,0,0,.35);
  --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
  --mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef0f3; --side: #f5f6f8; --main: #ffffff; --panel: #f7f8fa; --raised: #ffffff; --hover: #e6e9ed;
  --border: #dde1e6; --text: #24282e; --muted: #646b75; --faint: #9aa0a9;
  --accent: #1f8f7c; --accent-ink: #ffffff; --accent-soft: rgba(31,143,124,.1);
  --warn: #b7791f; --warn-soft: rgba(183,121,31,.1); --danger: #c24545; --danger-soft: rgba(194,69,69,.09);
  --ok: #2f9a56; --ok-soft: rgba(47,154,86,.11); --user-bubble: #eef1f4; --code-bg: #f4f5f7; --shadow: 0 8px 28px rgba(20,30,40,.14);
  --m-lead: #7a5fd6; --m-cx: #0f8a66; --m-cc: #c46a2c; --m-ag: #3473cc; --m-gk: #5b6370; --m-local: #b84f88; --m-you: #1f8f7c;
  --bot-ink: #ffffff; --bot-shadow: rgba(20,30,40,.18);
  color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #eef0f3; --side: #f5f6f8; --main: #ffffff; --panel: #f7f8fa; --raised: #ffffff; --hover: #e6e9ed;
  --border: #dde1e6; --text: #24282e; --muted: #646b75; --faint: #9aa0a9;
  --accent: #1f8f7c; --accent-ink: #ffffff; --accent-soft: rgba(31,143,124,.1);
  --warn: #b7791f; --warn-soft: rgba(183,121,31,.1); --danger: #c24545; --danger-soft: rgba(194,69,69,.09);
  --ok: #2f9a56; --ok-soft: rgba(47,154,86,.11); --user-bubble: #eef1f4; --code-bg: #f4f5f7; --shadow: 0 8px 28px rgba(20,30,40,.14);
  --m-lead: #7a5fd6; --m-cx: #0f8a66; --m-cc: #c46a2c; --m-ag: #3473cc; --m-gk: #5b6370; --m-local: #b84f88; --m-you: #1f8f7c;
  --bot-ink: #ffffff; --bot-shadow: rgba(20,30,40,.18);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); font: 13px/1.55 var(--font);
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--mono); }

.app { height: 100%; display: grid; grid-template-rows: 36px minmax(0,1fr) 26px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--main); box-shadow: var(--shadow); }

/* title bar */
.titlebar { display: flex; align-items: center; gap: 10px; padding: 0 10px; background: var(--bg); border-bottom: 1px solid var(--border); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.brand-mark { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); }
.title-center { color: var(--muted); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: center; }
.tb-btn { height: 24px; padding: 0 8px; white-space: nowrap; flex: none; border-radius: 6px; color: var(--muted); font-size: 12px; border: 1px solid var(--border); }
.tb-btn:hover { background: var(--hover); color: var(--text); }
.tb-btn.only-narrow { display: none; }

/* workbench */
.workbench { position: relative; display: grid; grid-template-columns: 44px 236px minmax(0,1fr) 300px; min-height: 0; }
.activity { background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; }
.act { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.act svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.act.active { color: var(--text); background: var(--hover); }
.act:hover { color: var(--text); }

/* project tree */
.side { background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.side-head { display: flex; align-items: center; padding: 10px 12px 6px; }
.side-title { flex: 1; font-size: 11px; font-weight: 600; letter-spacing: .8px; color: var(--muted); }
.tree { overflow-y: auto; padding: 0 6px 10px; display: flex; flex-direction: column; gap: 2px; }
.proj { display: flex; align-items: center; gap: 6px; padding: 6px 6px; border-radius: 6px; font-weight: 600; cursor: pointer; }
.proj:hover { background: var(--hover); }
.proj .chev { width: 10px; color: var(--faint); font-size: 10px; transition: transform .15s; }
.proj.open .chev { transform: rotate(90deg); }
.proj .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 10.5px; font-weight: 500; line-height: 16px; padding: 0 5px; border-radius: 4px; color: var(--accent); background: var(--accent-soft); white-space: nowrap; }
.tag.warn { color: var(--warn); background: var(--warn-soft); }
.count-dot { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--warn); color: var(--accent-ink); font-size: 10.5px; font-weight: 600; display: grid; place-items: center; }
.run-dot { font-size: 11px; color: var(--accent); font-weight: 500; }
.conv { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 22px; border-radius: 6px; color: var(--muted); cursor: pointer; min-height: 30px; }
.conv:hover { background: var(--hover); color: var(--text); }
.conv.active { background: var(--accent-soft); color: var(--text); }
.conv .cname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv .hash { width: 22px; text-align: center; color: var(--faint); font-weight: 600; }
.unread { font-size: 11px; color: var(--muted); }
.side-foot { margin-top: auto; padding: 8px 10px; border-top: 1px solid var(--border); }
.ghost { width: 100%; height: 28px; border-radius: 6px; border: 1px dashed var(--border); color: var(--muted); font-size: 12px; }
.ghost:hover { color: var(--text); border-color: var(--faint); }

/* center */
.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.chead { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--border); min-width: 0; flex-wrap: wrap; }
.chead h1 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; }
.chead .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
.strip { display: flex; align-items: flex-end; gap: 2px; margin-left: auto; }
.strip .slot { display: flex; flex-direction: column; align-items: center; width: 40px; cursor: pointer; border-radius: 6px; padding-top: 2px; }
.strip .slot:hover { background: var(--hover); }
.strip .slot span { font-size: 10px; color: var(--muted); line-height: 14px; }
.filters { display: flex; gap: 6px; padding: 8px 16px 0; flex-wrap: wrap; }
.fchip { height: 24px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--border); color: var(--muted); font-size: 12px; }
.fchip[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

.timeline { flex: 1; overflow-y: auto; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.day { align-self: center; font-size: 11px; color: var(--faint); }
.msg { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 10px; }
.msg .who { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; flex-wrap: wrap; }
.msg .who b { font-weight: 600; }
.msg .who .model { color: var(--faint); font-size: 11.5px; }
.msg .who time { color: var(--faint); font-size: 11px; }
.msg .body { min-width: 0; overflow-wrap: anywhere; }
.msg .body p { margin: 0 0 4px; }
.msg.you .body { background: var(--user-bubble); border-radius: 8px; padding: 6px 10px; justify-self: start; }
.at { color: var(--accent); font-weight: 500; }
.av { width: 34px; height: 34px; }
.quote { border-left: 2px solid var(--faint); padding: 2px 8px; margin: 2px 0 6px; color: var(--muted); font-size: 12px; }
.steps { display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 6px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); color: var(--muted); font-size: 12px; }
.steps:hover { color: var(--text); background: var(--hover); }
.steps-list { margin: 0 0 6px; padding: 6px 10px; border-radius: 6px; background: var(--code-bg); font-family: var(--mono); font-size: 12px; color: var(--muted); }
.steps-list div { white-space: pre-wrap; overflow-wrap: anywhere; }

.card { border: 1px solid var(--border); border-radius: 8px; background: var(--raised); padding: 8px 10px; margin: 4px 0 6px; max-width: 520px; }
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-top .kind { font-size: 11px; color: var(--muted); }
.card-top .tid { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.card .task-text { margin: 4px 0; }
.card .meta { display: flex; gap: 12px; color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.card .acts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.btn { height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.card.approval { border-color: var(--warn); background: linear-gradient(var(--warn-soft), var(--warn-soft)), var(--raised); }
.card.approval .head { display: flex; gap: 8px; align-items: center; font-weight: 600; color: var(--warn); }
.card.approval code { font-family: var(--mono); font-size: 12px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); }
.card.approval .where { color: var(--muted); font-size: 12px; }
.card.resolved { opacity: .75; }
.sys { align-self: center; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; text-align: center; }
.sys::before, .sys::after { content: ""; width: 28px; height: 1px; background: var(--border); }

.pill { display: inline-flex; align-items: center; gap: 5px; height: 18px; padding: 0 7px; border-radius: 9px; font-size: 11px; white-space: nowrap; background: var(--hover); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.work { color: var(--accent); background: var(--accent-soft); }
.pill.ask, .pill.limited { color: var(--warn); background: var(--warn-soft); }
.pill.done { color: var(--ok); background: var(--ok-soft); }
.pill.failed { color: var(--danger); background: var(--danger-soft); }
.pill.sleep { color: var(--faint); }

/* composer */
.composer { padding: 0 16px 14px; }
.cbox { border: 1px solid var(--border); border-radius: 10px; background: var(--raised); position: relative; }
.cbox:focus-within { border-color: var(--accent); }
.cbox textarea { width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 13.5px; padding: 10px 12px 4px; min-height: 44px; }
.cbar { display: flex; align-items: center; gap: 8px; padding: 4px 8px 8px; flex-wrap: wrap; }
.cbar label { font-size: 12px; color: var(--muted); }
.cbar select { height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--main); color: var(--text); font: inherit; font-size: 12px; padding: 0 6px; }
.mode-tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; line-height: 18px; }
.grow { flex: 1; }
.hint { color: var(--faint); font-size: 11.5px; }
.send { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.send svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mention { position: absolute; left: 10px; bottom: calc(100% + 6px); width: 280px; max-width: calc(100% - 20px); background: var(--raised); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; z-index: 5; }
.mention button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; text-align: left; }
.mention button:hover:not([disabled]), .mention button.sel { background: var(--hover); }
.mention button[disabled] { opacity: .5; cursor: not-allowed; }
.mention .mname { flex: 1; }

/* right panel */
.panel { background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.ptabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--border); }
.ptab { height: 30px; padding: 0 10px; color: var(--muted); border-bottom: 2px solid transparent; font-size: 12.5px; }
.ptab[aria-selected="true"] { color: var(--text); border-color: var(--accent); }
.pbody { overflow-y: auto; padding: 10px 12px 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.sec-title { font-size: 11px; font-weight: 600; letter-spacing: .8px; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.member { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 8px; align-items: center; padding: 4px 6px; border-radius: 8px; cursor: pointer; }
.member:hover { background: var(--hover); }
.member.focus { background: var(--accent-soft); }
.member .mtop { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.member .mtop b { font-weight: 600; }
.member .mrole { color: var(--muted); font-size: 11.5px; }
.member .mnow { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member canvas { width: 52px; height: 52px; }
.sheet-pick { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.sheet-pick button { height: 22px; padding: 0 8px; border-radius: 11px; border: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }
.sheet-pick button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
.sheet { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 4px 4px; }
.sheet .cell { display: flex; flex-direction: column; align-items: center; padding: 4px 0; border-radius: 6px; }
.sheet .cell canvas { width: 56px; height: 56px; max-width: 100%; }
.sheet .cell span { font-size: 11px; color: var(--muted); }
.sheet .cell small { font-size: 10px; color: var(--faint); }
.sheet-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--faint); margin-top: 6px; }
.res { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 6px 8px; align-items: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--hover); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.mid i { background: var(--warn); }
.task-row { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 8px; padding: 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--raised); }
.task-row .t1 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.task-row .t2 { color: var(--muted); font-size: 12px; }
.task-row .t3 { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.note { color: var(--faint); font-size: 11.5px; }

/* status bar */
.statusbar { display: flex; align-items: center; gap: 14px; padding: 0 10px; background: var(--bg); border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); overflow: hidden; white-space: nowrap; }
.sb { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.dot.ok { background: var(--ok); } .dot.work { background: var(--accent); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--danger); }
.sb-cli { display: inline-flex; gap: 8px; }
.sb-btn:hover { color: var(--text); }

/* responsive */
@media (max-width: 1180px) {
  .workbench { grid-template-columns: 44px 220px minmax(0,1fr); }
  .panel { display: none; position: absolute; right: 0; top: 0; bottom: 0; width: min(320px, 92%); z-index: 8; box-shadow: var(--shadow); }
  .app.show-panel .panel { display: flex; }
  .tb-btn.panel-btn { display: inline-block; }
}
@media (max-width: 760px) {
  .workbench { grid-template-columns: minmax(0,1fr); }
  .activity { display: none; }
  .side { display: none; position: absolute; left: 0; top: 0; bottom: 0; width: min(280px, 88%); z-index: 8; box-shadow: var(--shadow); }
  .app.show-side .side { display: flex; }
  .tb-btn.side-btn { display: inline-block; }
  .strip { margin-left: 0; width: 100%; overflow-x: auto; }
  .title-center { visibility: hidden; }
  .brand { font-size: 0; gap: 0; }
  .sb-hide { display: none; }
}
@media (prefers-reduced-motion: reduce) { .proj .chev { transition: none; } }

/* ================= Aqua glass skin + boot sequence + OS chrome ================= */
:root {
  --hue: 212; --blur: 22px; --frost: .42; --read-floor: .72; --bright: 1; --wall-blur: 0px;
  --glass-rgb: 14, 22, 38; --glass-line: rgba(255,255,255,.12); --glass-card: rgba(255,255,255,.06); --glass-card-line: rgba(255,255,255,.1);
  --aqua-ground: #060b15; --aqua-accent: hsl(var(--hue) 90% 66%); --aqua-accent-soft: hsla(var(--hue), 90%, 66%, .16); --aqua-accent-ink: #061020;
  --glow: hsla(var(--hue), 95%, 70%, .55); --aqua-muted: #a6b0c0; --aqua-faint: #7d889b;
  --boot-bg: radial-gradient(120% 90% at 50% 40%, hsla(var(--hue), 70%, 18%, .55), rgba(3,6,12,.92)); --boot-ink: hsl(var(--hue) 100% 93%); --boot-text: rgba(220,235,255,.8); --boot-dim: rgba(220,235,255,.45);
  --boot-glass: rgba(255,255,255,.07); --boot-line: rgba(255,255,255,.16); --boot-glow: 0 0 10px hsla(var(--hue), 100%, 72%, .95), 0 0 30px hsla(var(--hue), 100%, 62%, .6), 0 0 60px hsla(var(--hue), 100%, 55%, .35); --boot-ok: #7ee2a8; --boot-warn: #f2c14e;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --glass-rgb: 255, 255, 255; --glass-line: rgba(255,255,255,.9); --glass-card: rgba(255,255,255,.9); --glass-card-line: rgba(30,50,80,.1);
  --aqua-ground: #eef3f9; --aqua-accent: hsl(var(--hue) 75% 42%); --aqua-accent-soft: hsla(var(--hue), 75%, 42%, .12); --aqua-accent-ink: #ffffff;
  --glow: hsla(var(--hue), 90%, 55%, .35); --aqua-muted: #4f5864; --aqua-faint: #6f7884; --read-floor: .9;
  --boot-bg: radial-gradient(120% 90% at 50% 40%, hsla(var(--hue), 80%, 96%, .5), rgba(244,248,253,.94)); --boot-ink: hsl(var(--hue) 70% 30%); --boot-text: #3d4652; --boot-dim: #7a8491;
  --boot-glass: rgba(255,255,255,.72); --boot-line: rgba(30,60,100,.12); --boot-glow: 0 0 18px hsla(var(--hue), 95%, 70%, .55), 0 0 42px hsla(var(--hue), 95%, 75%, .4); --boot-ok: #1f8a4c; --boot-warn: #a86b0c;
} }
:root[data-theme="light"] {

const clock = () => { const d = new Date(); return d.toTimeString().slice(0, 5); };
function push(conv, msg) { msg.id = ++msgSeq; msg.time = msg.time || clock(); (convs[conv] ||= []).push(msg); if (conv === activeConv) appendMsg(msg, true); else { unread[conv] = (unread[conv] || 0) + 1; renderTree(); } return msg; }

function visible(msg) {
  if (filter === 'me') return msg.from === 'you' || (msg.text || '').includes('@你') || msg.kind === 'approval' || msg.kind === 'question';
  if (filter === 'todo') return (msg.kind === 'approval' && !msg.resolved) || (msg.kind === 'question' && !msg.resolved);
  return true;
}
function renderTimeline() {
  const tl = $('#timeline'); tl.innerHTML = '';
  const d = document.createElement('div'); d.className = 'day'; d.textContent = '今天'; tl.appendChild(d);
  for (const msg of convs[activeConv] || []) if (visible(msg)) appendMsg(msg, false);
  tl.scrollTop = tl.scrollHeight;
}
function appendMsg(msg, scroll) {
  if (!visible(msg)) return;
  const tl = $('#timeline');
  const el = msgEl(msg); msg.el = el; tl.appendChild(el);
  if (scroll) tl.scrollTop = tl.scrollHeight;
}
function rerender(msg) { if (msg.el && msg.el.isConnected) { const n = msgEl(msg); msg.el.replaceWith(n); msg.el = n; } }

function richText(s) { return esc(s).replace(/@(组长|Codex|Claude|Antigravity|Grok|本机|你|全员)/g, '<span class="at">@$1</span>').replace(/`([^`]+)`/g, '<code class="mono">$1</code>'); }
function msgEl(msg) {
  if (msg.kind === 'event') { const e = document.createElement('div'); e.className = 'sys'; e.textContent = msg.text; return e; }
  const el = document.createElement('div');
  el.className = 'msg' + (msg.from === 'you' ? ' you' : '');
  const avWrap = document.createElement('div');
  avWrap.appendChild(makeBot(msg.from, 34, { still: true, state: msg.from === 'you' ? 'idle' : 'idle' }));
  el.appendChild(avWrap);
  const right = document.createElement('div'); right.style.minWidth = '0';
  const who = document.createElement('div'); who.className = 'who';
  who.innerHTML = `<b style="color:var(${M[msg.from].color})">${esc(M[msg.from].name)}</b>${M[msg.from].model ? `<span class="model">${esc(M[msg.from].model)}</span>` : ''}${msg.via === 'wechat' ? '<span class="tag">来自微信</span>' : ''}<time>${msg.time}</time>`;
  right.appendChild(who);
  const body = document.createElement('div'); body.className = 'body';
  if (msg.quote) body.insertAdjacentHTML('beforeend', `<div class="quote">回复 ${esc(M[msg.quote.from].name)}：${esc(msg.quote.text)}</div>`);
  if (msg.steps) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'steps';
    b.textContent = (msg.open ? '▾ ' : '▸ ') + msg.steps.summary;
    b.setAttribute('aria-expanded', !!msg.open);
    b.addEventListener('click', () => { msg.open = !msg.open; rerender(msg); });
    body.appendChild(b);
    if (msg.open) body.insertAdjacentHTML('beforeend', `<div class="steps-list">${msg.steps.lines.map((l) => `<div>${esc(l)}</div>`).join('')}</div>`);
  }
  if (msg.text) body.insertAdjacentHTML('beforeend', msg.text.split('\n').map((l) => `<p>${richText(l)}</p>`).join(''));
  if (msg.kind === 'dispatch') for (const tid of msg.tasks) body.appendChild(taskCard(tasks[tid]));
  if (msg.kind === 'approval') body.appendChild(approvalCard(msg));
  right.appendChild(body); el.appendChild(right);
  return el;
}

const input = $('#input');

  input.value = ''; closeMention();

  push(activeConv, { from: 'you', text });
  if (text === '/compact') {
    const prev = status.lead.state;

  }
  const to = c.type === 'direct' ? c.with : (text.match(/@(Codex|Claude|Antigravity|Grok|本机)/) ? Object.keys(M).find((k) => M[k].name === RegExp.$1) : $('#toSelect').value);
  const target = to === 'all' ? 'lead' : to;
  if (status[target]?.state === 'limited') { push(activeConv, { kind: 'event', text: `${M[target].name} 额度用尽，消息已转给组长重新分配` }); return; }
  const prev = status[target]?.state || 'idle';

  });
}
$('#sendBtn').addEventListener('click', send);
input.addEventListener('keydown', (e) => {
  if (!$('#mention').hidden && ['ArrowDown', 'ArrowUp', 'Enter', 'Escape'].includes(e.key)) { mentionKey(e); return; }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  const v = input.value.slice(0, input.selectionStart);
  const m = /@([^\s@]*)$/.exec(v);
  if (m && convById(activeConv).c.type === 'group') openMention(m[1]); else closeMention();
});
let mentionSel = 0;
function openMention(q) {
  const box = $('#mention'); box.innerHTML = ''; box.hidden = false;
  const list = BOTS.filter((b) => !q || M[b].name.toLowerCase().includes(q.toLowerCase()) || M[b].short.includes(q));
  list.forEach((b, i) => {
    const st = status[b]?.state || 'idle'; const lim = st === 'limited';
    const btn = document.createElement('button'); btn.type = 'button'; btn.disabled = lim; if (i === mentionSel) btn.classList.add('sel');
    btn.appendChild(makeBot(b, 24));
    btn.insertAdjacentHTML('beforeend', `<span class="mname">${esc(M[b].name)}</span><span class="pill ${STATES[st].pill}">${STATES[st].label}</span>`);
    if (lim) btn.title = '额度用尽，18:00 重置';
    btn.addEventListener('click', () => pickMention(b));
    box.appendChild(btn);
  });
  if (!list.length) box.innerHTML = '<div class="note" style="padding:6px 8px">没有匹配的成员</div>';
}
function closeMention() { $('#mention').hidden = true; mentionSel = 0; }
function pickMention(b) {
  const pos = input.selectionStart; const before = input.value.slice(0, pos).replace(/@([^\s@]*)$/, '@' + M[b].name + ' ');
  input.value = before + input.value.slice(pos); input.focus(); input.selectionStart = input.selectionEnd = before.length; closeMention();
}
function mentionKey(e) {
  const btns = [...$('#mention').querySelectorAll('button:not([disabled])')];
  if (e.key === 'Escape') { closeMention(); return; }
  e.preventDefault();
  if (!btns.length) return;
  if (e.key === 'ArrowDown') mentionSel = (mentionSel + 1) % btns.length;
  if (e.key === 'ArrowUp') mentionSel = (mentionSel - 1 + btns.length) % btns.length;
  if (e.key === 'Enter') { btns[Math.min(mentionSel, btns.length - 1)].click(); return; }
  btns.forEach((b, i) => b.classList.toggle('sel', i === mentionSel));
}

    cell.insertAdjacentHTML('beforeend', `<span>${STATES[s].label}</span><small>${group[STATES[s].group]}</small>`);
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  wrap.insertAdjacentHTML('beforeend', '<p class="note" style="margin:8px 0 0">试试：把鼠标移到任意会动的头像上，它会睁眼看你；点一下会被「戳」到，连点四下会生气。在输入框发送 /compact 可以看到组长整理上下文。</p>');
  body.appendChild(wrap);
}
document.querySelectorAll('.ptab').forEach((t) => t.addEventListener('click', () => { panelTab = t.dataset.tab; renderPanel(); }));

function renderStatusBar() {
  const cli = $('#sbCli');
  const dot = (st) => ({ work: 'work', ask: 'warn', end: st === 'failed' ? 'bad' : 'ok', rest: st === 'limited' ? 'warn' : '', react: '' }[STATES[st].group]);
  cli.innerHTML = ['cc', 'cx', 'ag', 'gk'].map((b) => { const st = status[b]?.state || 'idle'; return `<span class="sb" title="${esc(M[b].name)}：${STATES[st].label}"><span class="dot ${dot(st)}"></span>${M[b].short} ${STATES[st].label}</span>`; }).join('');
  const running = BOTS.filter((b) => ['tool', 'long', 'thinking', 'asking'].includes(status[b]?.state) && b !== 'local' && b !== 'lead').length;
  $('#sbBox').textContent = `容器 ${Math.min(2, running)}/2`;
}

/* ---------------- chrome ---------------- */
document.querySelectorAll('.fchip').forEach((f) => f.addEventListener('click', () => {
  filter = f.dataset.f; document.querySelectorAll('.fchip').forEach((x) => x.setAttribute('aria-pressed', x === f)); renderTimeline();
}));
$('#sideBtn').addEventListener('click', () => $('#app').classList.toggle('show-side'));
$('#panelBtn').addEventListener('click', () => $('#app').classList.toggle('show-panel'));
$('#replayBtn').addEventListener('click', () => { activeConv = 'g-agentdesk'; startScenario(true); openConv('g-agentdesk'); });
$('#themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
  root.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', root.dataset.theme);
  readColors(); loadLogos(); drawAll(true); fluidFrame(performance.now(), true);
});

function renderAllViews() { renderTree(); renderStrip(); renderPanel(); renderStatusBar(); }

/* ---------------- appearance: skin, OS chrome, fluid background, wallpaper ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('agentdesk.proto.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('agentdesk.proto.' + k, JSON.stringify(v)); } catch {} },
};
if (!document.documentElement.dataset.theme) document.documentElement.dataset.theme = store.get('theme', 'light');
const look = {
  os: store.get('os', /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? 'mac' : 'win'),
  skin: store.get('skin', 'aqua'), layout: store.get('layout', 'float'), wall: 'off', boot: store.get('boot', 'each'),
  blur: store.get('blur', 28), frost: store.get('frost', 78), hue: store.get('hue', 212), bright: store.get('bright', 100), wallBlur: store.get('wallBlur', 6),
};
let wallUrl = null;
function applyLook() {
  const r = document.documentElement;
  r.dataset.os = look.os; r.dataset.skin = look.skin; r.dataset.layout = look.layout; r.dataset.wall = wallUrl && look.wall === 'on' ? 'on' : 'off';
  r.style.setProperty('--blur', look.blur + 'px'); r.style.setProperty('--frost', look.frost / 100);
  r.style.setProperty('--hue', look.hue); r.style.setProperty('--bright', look.bright / 100); r.style.setProperty('--wall-blur', look.wallBlur + 'px');
  $('#wall').style.backgroundImage = wallUrl ? `url("${wallUrl}")` : '';
  document.querySelectorAll('.look .seg').forEach((g) => g.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', look[g.dataset.key] === b.dataset.v)));
  for (const [id, key, unit] of [['Blur', 'blur', 'px'], ['Frost', 'frost', '%'], ['Hue', 'hue', '°'], ['Bright', 'bright', '%'], ['Wall', 'wallBlur', 'px']]) {
    $('#r' + id).value = look[key]; $('#o' + id).textContent = look[key] + unit;
  }
  $('#sendBtn').title = look.os === 'mac' ? '发送（⌘↩）' : '发送（Ctrl+Enter）';
  readColors(); loadLogos(); drawAll(true); fluidFrame(performance.now(), true);
}
document.querySelectorAll('.look .seg').forEach((g) => g.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  look[g.dataset.key] = b.dataset.v; if (g.dataset.key !== 'wall') store.set(g.dataset.key, b.dataset.v);
  if (g.dataset.key === 'wall' && b.dataset.v === 'on' && !wallUrl) $('#wallFile').click();
  applyLook();
}));
for (const [id, key] of [['Blur', 'blur'], ['Frost', 'frost'], ['Hue', 'hue'], ['Bright', 'bright'], ['Wall', 'wallBlur']]) {
  $('#r' + id).addEventListener('input', (e) => { look[key] = +e.target.value; store.set(key, look[key]); applyLook(); });
}
$('#wallFile').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (wallUrl) URL.revokeObjectURL(wallUrl);
  wallUrl = URL.createObjectURL(f); look.wall = 'on'; applyLook();
});
$('#lookBtn').addEventListener('click', () => { const box = $('#look'); box.hidden = !box.hidden; $('#lookBtn').setAttribute('aria-expanded', !box.hidden); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#look').hidden && $('#boot').hidden) { $('#look').hidden = true; $('#lookBtn').setAttribute('aria-expanded', 'false'); } });
$('#replayBoot').addEventListener('click', () => { $('#look').hidden = true; runBoot(true); });

// Flowing background: a few large soft colour fields drifting slowly, drawn small and scaled up.
const fluid = $('#fluid'); const fctx = fluid.getContext('2d');
let fluidLast = 0;
function fluidFrame(now, force) {
  if (look.skin !== 'aqua') return;
  if (!force && (document.hidden || now - fluidLast < 66)) return;
  fluidLast = now;
  const w = Math.max(64, Math.round(innerWidth / 8)), h = Math.max(64, Math.round(innerHeight / 8));
  if (fluid.width !== w || fluid.height !== h) { fluid.width = w; fluid.height = h; }
  const light = isLight(), t = reduceMotion.matches ? 0 : now / 1000, H = look.hue;
  fctx.globalCompositeOperation = 'source-over';
  fctx.fillStyle = light ? `hsl(${H} 40% 96%)` : `hsl(${H} 70% 5%)`; fctx.fillRect(0, 0, w, h);
  fctx.globalCompositeOperation = light ? 'multiply' : 'screen';
  const blobs = [[0.25, 0.3, 0.55, 0, 0.11], [0.75, 0.25, 0.5, 40, 0.08], [0.6, 0.75, 0.6, -30, 0.09], [0.2, 0.8, 0.45, 70, 0.12], [0.5, 0.5, 0.35, 15, 0.07]];
  blobs.forEach(([x, y, r, dh, sp], i) => {
    const cx = (x + Math.sin(t * sp + i * 1.7) * 0.18) * w, cy = (y + Math.cos(t * sp * 1.3 + i) * 0.16) * h, rr = r * Math.max(w, h);
    const g = fctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
    g.addColorStop(0, light ? `hsla(${H + dh} 80% 80% / .75)` : `hsla(${H + dh} 85% 42% / .75)`);
    g.addColorStop(1, light ? `hsla(${H + dh} 80% 90% / 0)` : `hsla(${H + dh} 85% 30% / 0)`);
    fctx.fillStyle = g; fctx.fillRect(0, 0, w, h);
  });
  fctx.globalCompositeOperation = 'source-over';
}
(function fluidLoop(now) { fluidFrame(now, false); requestAnimationFrame(fluidLoop); })(performance.now());
addEventListener('resize', () => fluidFrame(performance.now(), true));

/* ---------------- boot sequence ----------------
   Real app: plays once per app launch (main process start). Minimising and restoring the window, or reopening it
   from the tray, does not replay it. Each line is a real startup check (remote.js status, orchestrator route,
   CLI login/quota) and the bar follows real progress. Here the checks are simulated. */
const BOOT_CHECKS = [
  ['连接 VPS · SSH 主线路', 'ok', '已连接', null],
  ['主控 Orchestrator', 'ok', '在线', null],
  ['Claude Code · 组长', 'ok', '就绪', 'lead'],
  ['Codex · 改代码', 'ok', '就绪', 'cx'],
  ['Antigravity · 侦察', 'ok', '就绪', 'ag'],
  ['Grok Build · 审查', 'warn', '额度用尽 · 18:00 重置', 'gk'],
  ['本机 Bridge · 桌面与文件', 'ok', '已授权', 'local'],
];
let bootTimers = [];
function shouldBoot() {
  if (look.boot === 'off') return false;
  return true;
}
function endBoot() {
  const boot = $('#boot'); if (boot.hidden || boot.classList.contains('leaving')) return;
  bootTimers.forEach(clearTimeout); bootTimers = [];
  boot.classList.add('leaving'); $('#app').classList.remove('booting');
  setTimeout(() => { boot.hidden = true; boot.classList.remove('leaving'); $('#input').focus({ preventScroll: true }); }, reduceMotion.matches ? 300 : 700);
}
function runBoot(force) {
  if (!force && !shouldBoot()) return;
  const boot = $('#boot'), title = $('#bootTitle'), term = $('#bootTerm'), bots = $('#bootBots'), bar = $('#bootBar');
  bootTimers.forEach(clearTimeout); bootTimers = [];
  title.innerHTML = [...'AgentDesk'].map((c, i) => `<span style="animation-delay:${0.15 + i * 0.07}s">${c}</span>`).join('');
  term.innerHTML = ''; bots.innerHTML = ''; bar.style.width = '0%';
  const botEls = {};
  BOOT_CHECKS.forEach(([, , , id], i) => { if (!id) return; const c = makeBot(id, 52, { state: 'idle' }); c._bot.fixedSince = 0; c.style.animationDelay = (1.2 + i * 0.08) + 's'; bots.appendChild(c); botEls[id] = c; });
  boot.hidden = false; boot.classList.remove('leaving'); $('#app').classList.add('booting');
  $('#bootSkip').focus({ preventScroll: true });
  const quick = reduceMotion.matches;
  const step = quick ? 0 : 430, start = quick ? 0 : 1500;
  BOOT_CHECKS.forEach(([label, kind, value, id], i) => {
    bootTimers.push(setTimeout(() => {
      const row = document.createElement('div');
      row.innerHTML = `<span class="k">▸ ${esc(label)}</span><span class="v wait">检查中…</span>`;
      term.appendChild(row);
      bootTimers.push(setTimeout(() => {
        row.querySelector('.v').className = 'v ' + kind; row.querySelector('.v').textContent = value;
        bar.style.width = Math.round((i + 1) / BOOT_CHECKS.length * 100) + '%';
        const c = id && botEls[id];
        if (c) {   // the logo wakes up as its check passes
          c._bot.fixed = kind === 'warn' ? 'limited' : 'done'; c._bot.fixedSince = performance.now();
          if (kind !== 'warn') bootTimers.push(setTimeout(() => { c._bot.fixed = 'idle'; }, 1400));
        }
      }, quick ? 0 : 260));
    }, start + i * step));
  });
  bootTimers.push(setTimeout(endBoot, quick ? 900 : start + BOOT_CHECKS.length * step + 900));
}
$('#bootSkip').addEventListener('click', endBoot);
$('#boot').addEventListener('dblclick', endBoot);   // a single click does nothing, so a stray click never skips it
document.addEventListener('keydown', (e) => { if (!$('#boot').hidden && ['Escape', 'Enter', ' '].includes(e.key)) { e.preventDefault(); endBoot(); } });

startScenario(false);
openConv('g-agentdesk');
applyLook();
runBoot(false);
})();
</script>
