<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>AgentDesk</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="group.css" />
  <link rel="stylesheet" href="task-graph.css" />
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 7 5 5-5 5m8 0h6"/></svg></span>
      AgentDesk
    </div>
    <div class="title-center"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h6l2 2h10v11H3z"/></svg><span id="titleProject"></span></div>
    <div class="title-spacer"></div>
  </header>

  <div class="workbench">
    <nav class="project-rail" aria-label="导航">
      <button class="icon-btn" id="railProjects" type="button" title="项目列表" aria-label="项目列表"><svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></svg></button>
      <button class="icon-btn" id="railSearch" type="button" title="搜索对话 (Ctrl+K)" aria-label="搜索对话"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></button>
    </nav>
    <aside class="sidebar" id="sidebar" aria-label="项目与对话">
      <label class="side-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
        <input id="sessionSearch" aria-label="搜索项目与对话" placeholder="搜索项目与对话" />
        <kbd>Ctrl K</kbd>
      </label>
      <div class="side-title">项目</div>
      <div class="side-list" id="sessionList"></div>
      <div class="side-footer">
        <button class="side-action" id="sbOrchestrator" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="5" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/><rect x="14" y="16" width="7" height="5" rx="1"/><path d="M12 8v4m-5.5 4v-4h11v4"/></svg>
          <span>主控线路</span>
        </button>
        <button class="side-action" id="themeToggle" type="button" title="切换深浅色">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg><span>深色模式</span>
        </button>
      </div>
    </aside>
    <div class="splitter" id="leftSplit"></div>

    <main class="center">
      <div class="session-strip">
        <button class="icon-btn strip-toggle" id="toggleSidebar" type="button" title="切换侧栏 (Ctrl+B)" aria-label="会话侧栏" aria-controls="sidebar">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14"/></svg>
        </button>
        <div class="group-breadcrumb" id="directBreadcrumb"></div>
        <div id="groupBreadcrumb" class="group-breadcrumb" hidden></div>
        <button class="icon-btn strip-toggle" id="sbPanel" type="button" title="切换工作区面板 (Ctrl+J)" aria-label="工作区面板" aria-controls="panel">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M15 5v14"/></svg>
        </button>
      </div>
      <header class="conversation-head" id="conversationHead" data-direct>
        <div class="direct-conversation-label">
          <span id="directAvatar" class="direct-avatar"></span>
          <h1 id="conversationTitle"></h1>
        </div>
        <span class="conversation-state" id="conversationState"></span>
      </header>
      <div class="timeline" id="timeline" data-direct></div>
      <div class="composer" data-direct>
        <div class="composer-box">
          <div class="attach-list" id="attachList"></div>
          <textarea id="input" rows="2" aria-label="任务描述" placeholder="描述你想让助手做的事…"></textarea>
          <div class="composer-bar">
            <button class="chip" id="attachBtn" title="附加文件"><svg viewBox="0 0 24 24"><path d="M16 7l-7.5 7.5a2.5 2.5 0 0 0 3.5 3.5L19 11a4.5 4.5 0 0 0-6.4-6.4L5 12.2"/></svg>附件</button>
            <div class="select-wrap">
              <select id="modeSelect" title="权限模式">
                <option value="ask">每步询问</option>
                <option value="edit">自动编辑</option>
                <option value="plan">只读规划</option>
                <option value="auto" title="本机用户文件、C 盘非系统位置及 D 盘。Codex 命令和本机工具无需逐次批准。">完全访问</option>
              </select>
            </div>
            <div class="select-wrap">
              <select id="modelSelect" title="模型（mock）">
                <option>Lumen-Pro</option>
                <option>Lumen-Swift</option>
                <option>Lumen-Mini</option>
              </select>
            </div>
            <div class="select-wrap" id="effortWrap" hidden>
              <select id="effortSelect" title="推理强度"></select>
            </div>
            <div class="select-wrap" id="tierWrap" hidden>
              <select id="tierSelect" title="速度">
                <option value="">标准速度</option>
              </select>
            </div>
            <div class="grow"></div>
            <span class="hint" id="ctxHint"></span>
            <button class="send" id="sendBtn" title="发送" aria-label="发送"><svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
          </div>
        </div>
        <div class="composer-hints"><span><kbd>Enter</kbd> 发送</span><span><kbd>Shift + Enter</kbd> 换行</span></div>
      </div>
      <section id="projectGroup" class="project-group" aria-labelledby="groupTitle" hidden>
        <header class="group-conversation-head">
          <div class="group-conversation-name">
            <h1 id="groupTitle"># 群聊</h1>
            <span id="groupSubtitle"></span>
          </div>
          <div class="group-roster" id="groupRoster" aria-label="群成员"></div>
        </header>
        <div class="group-filters" id="groupFilters" aria-label="消息筛选">
          <button type="button" data-group-filter="all" aria-pressed="true">全部</button>
          <button type="button" data-group-filter="mine" aria-pressed="false">与我相关</button>
          <button type="button" data-group-filter="attention" aria-pressed="false">待处理</button>
          <label><span class="visually-hidden">按成员筛选</span><select id="groupMemberFilter"><option value="">所有成员</option></select></label>
        </div>
        <div class="group-timeline" id="groupTimeline" aria-label="群聊时间线"></div>
        <form class="group-composer" id="groupForm">
          <div class="group-compose-box">
            <div id="groupSuggestions" class="group-suggestions" aria-label="成员和命令建议" hidden></div>
            <div id="groupPlanReply" class="group-plan-reply" hidden><span id="groupPlanReplyText"></span><button class="btn" type="button" id="groupPlanReplyCancel">取消回复</button></div>
            <textarea id="groupInput" rows="2" maxlength="12000" placeholder="向组长描述任务…" aria-label="群聊消息" title="输入 @Codex、@Claude、@Grok 或 @Gemini 可指定方案确认后的执行者" required></textarea>
            <div class="group-compose-controls">
              <button type="button" class="group-mention-button" id="groupMention" aria-label="选择成员" title="选择成员">@</button>
              <label class="group-recipient">执行者
                <select id="groupRecipient" aria-label="方案确认后的执行者">
                  <option value="">由组长分派</option>
                  <option value="codex">Codex</option>
                  <option value="claude">Claude Code</option>
                  <option value="grok">Grok Build</option>
                  <option value="gemini">Gemini</option>
                </select>
              </label>
              <input id="groupModel" type="text" placeholder="模型 ID（可选）" aria-label="模型 ID" maxlength="128" hidden disabled />
              <span class="grow"></span>
              <button class="send" id="groupSend" type="submit" title="发送任务" aria-label="发送任务"><svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
            </div>
          </div>
          <div class="group-compose-foot">
            <span id="groupSendStatus" role="status"></span>
            <span><kbd>Enter</kbd> 发送 · <kbd>Shift + Enter</kbd> 换行</span>
          </div>
        </form>
      </section>
    </main>

    <div class="splitter" id="rightSplit"></div>
    <!-- 右侧面板 -->
    <section class="panel" id="panel" aria-labelledby="panelTitle">
      <div class="panel-heading">
        <h2 id="panelTitle">检查工作区</h2>
        <button class="icon-btn" id="closePanel" type="button" title="收起面板 (Ctrl+J)" aria-label="收起工作区面板"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="panel-tabs">
        <button class="ptab" data-panel="members" data-group-panel hidden>成员</button>
        <button class="ptab" data-panel="tasks" data-group-panel hidden>任务<span class="badge" id="taskBadge"></span></button>
        <button class="ptab" data-panel="graph" data-group-panel hidden>调度图</button>
        <button class="ptab active" data-panel="diff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16m8-16v16M4 8h8m0 8h8"/></svg>改动<span class="badge" id="diffBadge"></span></button>
        <button class="ptab" data-panel="terminal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 6 6 6-6 6m9 0h7"/></svg>终端</button>
        <button class="ptab" data-panel="files"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h6l2 2h10v11H3z"/></svg>文件</button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </section>
  </div>

  <!-- 状态栏 -->
  <footer class="statusbar">
    <span class="sb-item"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8M18 10c0 4-6 3-10 6"/></svg><span id="sbBranch">main</span></span>
    <span class="sb-item" id="sbState"><span class="dot ok"></span>空闲</span>
    <button class="sb-item clickable" id="sbGroupRoute" type="button" hidden></button>
    <div id="sbGroupMembers" class="group-status-members" hidden></div>
    <span class="sb-item" id="sbMode">每步询问</span>
    <div class="grow"></div>
    <button class="sb-item clickable desktop-status" id="sbDesktop" type="button" title="点击断开或恢复本机桌面控制">桌面控制</button>
    <button class="sb-item clickable" id="sbConn" type="button" title="点击重新连接"><span class="dot wait"></span>正在连接…</button>
    <button class="sb-item clickable reconnect-button" id="sbReconnect" type="button" title="立即重建 VPS 连接和启用的隧道">重新连接</button>
    <button class="sb-item clickable" id="sbPet" type="button" title="点击重新检测"><span class="dot"></span>桌宠检测中</button>
    <span class="sb-item" id="sbTokens"></span>
  </footer>

  <dialog id="orchestratorDialog" class="orchestrator-dialog" aria-labelledby="orchestratorTitle">
    <form method="dialog" class="orchestrator-heading">
      <h2 id="orchestratorTitle">主控线路</h2>
      <button type="submit" class="orchestrator-close" aria-label="关闭">×</button>
    </form>
    <div class="orchestrator-routes" aria-label="执行线路">
      <button id="orchestratorSsh" data-route="ssh" type="button"><strong>SSH 主用</strong><span>检测中</span></button>
      <button id="orchestratorRelay" data-route="relay" type="button"><strong>VPS 1 Relay 备用</strong><span>检测中</span></button>
    </div>
    <p id="orchestratorMessage" role="status" aria-live="polite"></p>
  </dialog>
  <dialog id="enrollmentDialog" class="orchestrator-dialog" aria-labelledby="enrollmentTitle">
    <form id="enrollmentForm">
      <h2 id="enrollmentTitle">登录 AgentDesk</h2>
      <label for="enrollmentPassword">连接密码</label>
      <input id="enrollmentPassword" type="password" autocomplete="off" maxlength="256" autofocus required />
      <button id="enrollmentSubmit" type="submit">连接</button>
      <p id="enrollmentStatus" role="status" aria-live="polite"></p>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="data.js"></script>
  <script src="avatars.js"></script>
  <script src="app.js"></script>
  <script src="live.js"></script>
  <script src="task-graph.js"></script>
  <script src="orchestrator.js"></script>
  <script src="enrollment.js"></script>
</body>
</html>
