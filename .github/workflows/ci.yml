name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The tests use only Node built-ins (node:test, node:sqlite), so no install step is needed.
      - run: node --test "test/*.test.js"

  relay:
    name: Relay tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
        working-directory: relay
